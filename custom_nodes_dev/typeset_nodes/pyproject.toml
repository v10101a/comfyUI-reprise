[project]
name = "typeset-nodes"
description = "Reprise: a music video studio and ComfyUI node pack. Iterate on scenes and takes, then compose footage, music and editable typography with reusable analysis."
version = "0.2.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["typography", "lyrics", "captions", "tracking", "homography", "reframe", "beat", "whisper", "motion-graphics"]
dependencies = [
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "numpy",
    "opencv-python>=4.8",
    "pillow>=10",
    "scipy",
]

# comfy-cli / Comfy Registry metadata. Not published yet: set PublisherId after registering a publisher,
# then `comfy node publish`.
[tool.comfy]
PublisherId = ""
DisplayName = "Reprise — music video studio and nodes"
Icon = ""
includes = ["fonts/", "docs/"]
